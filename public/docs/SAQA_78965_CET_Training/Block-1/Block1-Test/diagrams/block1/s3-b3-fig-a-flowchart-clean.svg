<svg xmlns="http://www.w3.org/2000/svg" width="820" height="680" viewBox="0 0 820 680" role="img" aria-labelledby="title desc">
  <title id="title">Section 3 Figure A — Blank Flowchart</title>
  <desc id="desc">Blank flowchart with numbered markers for learner completion.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3c88" />
    </marker>
    <style>
      .shape{fill:#fff;stroke:#1f3c88;stroke-width:3}
      .line{stroke:#1f3c88;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .call{fill:#f97316;stroke:#fff;stroke-width:2}
      .num{font:700 16px Arial,sans-serif;fill:#fff}
      .tagFill{fill:#eef5ff;stroke:#8aa7d6;stroke-width:1.5}
      .tagText{font:700 12px Arial,sans-serif;fill:#16325c;letter-spacing:.4px}
    </style>
  </defs>
  <rect width="820" height="680" fill="#fbfdff"/>
