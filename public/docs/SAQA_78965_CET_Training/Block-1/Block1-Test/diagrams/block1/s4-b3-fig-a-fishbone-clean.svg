<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Section 4 Figure A — Blank Fishbone Diagram</title>
  <desc id="desc">Blank fishbone diagram with numbered markers for learner completion.</desc>
  <style>
    .line{stroke:#1f3c88;stroke-width:4;fill:none}
    .box{fill:#fff;stroke:#1f3c88;stroke-width:3}
    .call{fill:#f97316;stroke:#fff;stroke-width:2}
    .num{font:700 16px Arial,sans-serif;fill:#fff}
    .tagFill{fill:#eef5ff;stroke:#8aa7d6;stroke-width:1.5}
    .tagText{font:700 12px Arial,sans-serif;fill:#16325c;letter-spacing:.4px}
  </style>
  <rect width="920" height="520" fill="#fbfdff"/>
  <rect x="720" y="18" width="150" height="28" rx="14" class="tagFill"/>
  <text x="795" y="36" text-anchor="middle" class="tagText">Section 4 · B3 · Fig A</text>

  <line x1="120" y1="260" x2="700" y2="260" class="line"/>
  <polygon points="700,245 700,275 760,260" fill="#1f3c88"/>
  <rect x="760" y="220" width="110" height="80" rx="8" class="box"/>

  <line x1="240" y1="260" x2="170" y2="180" class="line"/>
  <line x1="240" y1="260" x2="170" y2="340" class="line"/>
  <line x1="430" y1="260" x2="360" y2="180" class="line"/>
  <line x1="430" y1="260" x2="360" y2="340" class="line"/>
  <line x1="600" y1="260" x2="530" y2="180" class="line"/>
  <line x1="600" y1="260" x2="530" y2="340" class="line"/>

  <text x="335" y="168" style="font:14px Arial,sans-serif;fill:#4b5563">Environment</text>
  <text x="340" y="360" style="font:14px Arial,sans-serif;fill:#4b5563">Policy</text>
  <text x="515" y="360" style="font:14px Arial,sans-serif;fill:#4b5563">Time</text>

  <circle cx="160" cy="170" r="18" class="call"/><text x="160" y="176" text-anchor="middle" class="num">1</text>
  <circle cx="160" cy="350" r="18" class="call"/><text x="160" y="356" text-anchor="middle" class="num">2</text>
  <circle cx="520" cy="170" r="18" class="call"/><text x="520" y="176" text-anchor="middle" class="num">3</text>
  <circle cx="815" cy="260" r="18" class="call"/><text x="815" y="266" text-anchor="middle" class="num">4</text>
