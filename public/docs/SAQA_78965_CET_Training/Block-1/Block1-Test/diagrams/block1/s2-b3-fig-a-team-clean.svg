<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
  <title id="title">Section 2 Figure A — Blank Team Diagram</title>
  <desc id="desc">Blank team collaboration diagram with numbered markers for learner completion.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3c88" />
    </marker>
    <style>
      .box{fill:#fff;stroke:#1f3c88;stroke-width:3}
      .task{fill:#eef5ff;stroke:#1f3c88;stroke-width:3}
      .line{stroke:#1f3c88;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .hint{font:14px Arial,sans-serif;fill:#4b5563}
      .call{fill:#f97316;stroke:#fff;stroke-width:2}
      .num{font:700 16px Arial,sans-serif;fill:#fff}
      .tagFill{fill:#eef5ff;stroke:#8aa7d6;stroke-width:1.5}
      .tagText{font:700 12px Arial,sans-serif;fill:#16325c;letter-spacing:.4px}
    </style>
  </defs>
  <rect width="920" height="540" fill="#fbfdff"/>
  <rect x="720" y="18" width="150" height="28" rx="14" class="tagFill"/>
  <text x="795" y="36" text-anchor="middle" class="tagText">Section 2 · B3 · Fig A</text>

  <rect x="370" y="70" width="180" height="60" rx="10" class="box"/>
  <rect x="90" y="220" width="170" height="60" rx="10" class="box"/>
  <rect x="660" y="220" width="170" height="60" rx="10" class="box"/>
  <rect x="355" y="220" width="210" height="90" rx="10" class="task"/>
  <text x="460" y="248" text-anchor="middle" class="hint">Task</text>
  <text x="460" y="272" text-anchor="middle" class="hint">Prepare lab booking plan</text>

  <path d="M 410 130 L 220 220" class="line"/>
  <path d="M 510 130 L 700 220" class="line"/>
  <path d="M 260 250 L 355 250" class="line"/>
  <path d="M 565 250 L 660 250" class="line"/>
  <path d="M 220 295 Q 460 400 700 295" stroke="#1f3c88" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <circle cx="460" cy="100" r="18" class="call"/><text x="460" y="106" text-anchor="middle" class="num">1</text>
  <circle cx="175" cy="250" r="18" class="call"/><text x="175" y="256" text-anchor="middle" class="num">2</text>
  <circle cx="460" cy="245" r="18" class="call"/><text x="460" y="251" text-anchor="middle" class="num">3</text>
  <circle cx="455" cy="392" r="18" class="call"/><text x="455" y="398" text-anchor="middle" class="num">4</text>
</svg>