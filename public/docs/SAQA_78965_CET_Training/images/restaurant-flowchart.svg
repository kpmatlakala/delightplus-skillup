<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1E3A8A">Restaurant Ordering Process Flowchart</text>

  <!-- Start -->
  <rect x="350" y="60" width="100" height="40" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E3A8A">Start</text>

  <!-- Arrow to Customer Arrives -->
  <path d="M400 100 L400 130" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Customer Arrives -->
  <rect x="325" y="140" width="150" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="400" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#92400E">Customer</text>
  <text x="400" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#92400E">Arrives</text>

  <!-- Arrow to Seated -->
  <path d="M400 190 L400 220" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Seated -->
  <rect x="325" y="230" width="150" height="50" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#047857">Seated by</text>
  <text x="400" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#047857">Waiter</text>

  <!-- Arrow to Menu Given -->
  <path d="M400 280 L400 310" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Menu Given -->
  <rect x="325" y="320" width="150" height="50" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="400" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0C4A6E">Menu</text>
  <text x="400" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0C4A6E">Given</text>

  <!-- Arrow to Order Taken -->
  <path d="M400 370 L400 400" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Order Taken -->
  <rect x="325" y="410" width="150" height="50" rx="8" fill="#FCE7F3" stroke="#BE185D" stroke-width="2"/>
  <text x="400" y="425" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#831843">Order</text>
  <text x="400" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#831843">Taken</text>

  <!-- Arrow to Decision: Food Ready? -->
  <path d="M400 460 L400 490" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decision Diamond -->
  <polygon points="400,500 350,530 400,560 450,530" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="400" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#92400E">Food Ready?</text>

  <!-- No arrow -->
  <path d="M375 530 L325 530" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="275" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280">No</text>

  <!-- Wait box -->
  <rect x="150" y="540" width="100" height="40" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="200" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B91C1C">Wait</text>

  <!-- Loop back arrow -->
  <path d="M250 560 L350 560 L350 540" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Yes arrow -->
  <path d="M425 530 L475 530" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="475" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280">Yes</text>

  <!-- Food Served -->
  <rect x="525" y="515" width="120" height="50" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="2"/>
  <text x="585" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#047857">Food</text>
  <text x="585" y="545" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#047857">Served</text>

  <!-- Arrow to Eat -->
  <path d="M585 565 L585 595" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Eat -->
  <rect x="550" y="605" width="70" height="40" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="585" y="630" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0C4A6E">Eat</text>

  <!-- Arrow to Pay -->
  <path d="M585 645 L585 675" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Pay -->
  <rect x="550" y="685" width="70" height="40" rx="8" fill="#FCE7F3" stroke="#BE185D" stroke-width="2"/>
  <text x="585" y="710" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#831843">Pay</text>

  <!-- Arrow to End -->
  <path d="M585 725 L585 755" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- End -->
  <rect x="560" y="765" width="50" height="30" rx="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="585" y="785" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1E3A8A">End</text>

  <!-- Missing labels to be filled -->
  <rect x="50" y="200" width="120" height="30" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="110" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6B7280">Label A</text>

  <rect x="630" y="200" width="120" height="30" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="690" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6B7280">Label B</text>

  <rect x="50" y="400" width="120" height="30" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="110" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6B7280">Label C</text>

  <rect x="630" y="400" width="120" height="30" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="690" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6B7280">Label D</text>

  <rect x="50" y="600" width="120" height="30" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="110" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6B7280">Label E</text>
</svg>