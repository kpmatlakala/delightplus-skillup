<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Structure Diagram Template</title>
  <desc id="desc">Hierarchical structure chart showing Main program and child modules ValidateInput, Calculate and Output.</desc>
  <style>
    .title{font:700 26px Arial, sans-serif; fill:#16325c}
    .label{font:700 16px Arial, sans-serif; fill:#1f2937}
    .hint{font:14px Arial, sans-serif; fill:#4b5563}
    .box{fill:#fff; stroke:#1f3c88; stroke-width:3; rx:8}
    .line{stroke:#1f3c88; stroke-width:3; fill:none}
    .tagFill{fill:#eef5ff; stroke:#8aa7d6; stroke-width:1.5}
    .tagText{font:700 12px Arial, sans-serif; fill:#16325c; letter-spacing:.4px}
  </style>
  <rect width="900" height="520" fill="#fbfdff"/>
  <rect x="700" y="18" width="150" height="28" rx="14" class="tagFill"/>
  <text x="775" y="36" text-anchor="middle" class="tagText">Section 5 · B3 · Fig A</text>

  <rect x="360" y="90" width="180" height="60" rx="8" class="box"/>
  <text x="450" y="126" text-anchor="middle" class="label">Main Program</text>

  <line x1="450" y1="150" x2="450" y2="215" class="line"/>
  <line x1="180" y1="215" x2="720" y2="215" class="line"/>
  <line x1="220" y1="215" x2="220" y2="245" class="line"/>
  <line x1="450" y1="215" x2="450" y2="245" class="line"/>
  <line x1="680" y1="215" x2="680" y2="245" class="line"/>

  <rect x="120" y="245" width="200" height="60" rx="8" class="box"/>
  <text x="220" y="280" text-anchor="middle" class="label">ValidateInput</text>

  <rect x="350" y="245" width="200" height="60" rx="8" class="box"/>
  <text x="450" y="280" text-anchor="middle" class="label">CalculateResult</text>

  <rect x="580" y="245" width="200" height="60" rx="8" class="box"/>
  <text x="680" y="280" text-anchor="middle" class="label">OutputResult</text>

  <line x1="450" y1="305" x2="450" y2="350" class="line"/>
  <line x1="390" y1="350" x2="510" y2="350" class="line"/>
  <line x1="420" y1="350" x2="420" y2="380" class="line"/>
  <line x1="480" y1="350" x2="480" y2="380" class="line"/>

  <rect x="330" y="380" width="180" height="55" rx="8" class="box"/>
  <text x="420" y="413" text-anchor="middle" class="label">SaveRecord</text>
  <rect x="390" y="445" width="120" height="45" rx="8" fill="#eef5ff" stroke="#8aa7d6" stroke-width="2"/>
  <text x="450" y="473" text-anchor="middle" class="hint">sub-module</text>
</svg>