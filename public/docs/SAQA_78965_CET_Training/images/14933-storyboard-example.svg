<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#F8FAFC"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0F172A">Storyboard Example for a Simple Web Application</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Three planned screens showing how the page idea develops before coding begins</text>

  <defs>
    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="60" y="130" width="320" height="470" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="60" y="130" width="320" height="38" rx="18" fill="#DBEAFE"/>
    <circle cx="88" cy="149" r="5" fill="#2563EB"/>
    <circle cx="104" cy="149" r="5" fill="#60A5FA"/>
    <circle cx="120" cy="149" r="5" fill="#93C5FD"/>
    <text x="220" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">Screen 1 — Home Page</text>
    <rect x="86" y="188" width="268" height="58" rx="10" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="220" y="223" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#075985">Banner / Logo</text>
    <rect x="86" y="262" width="84" height="150" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="128" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#334155">Menu</text>
    <text x="128" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Home</text>
    <text x="128" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">About</text>
    <text x="128" y="361" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Courses</text>
    <text x="128" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Contact</text>
    <rect x="184" y="262" width="170" height="92" rx="10" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="269" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#92400E">Intro Text</text>
    <text x="269" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#A16207">Purpose and welcome</text>
    <rect x="184" y="370" width="170" height="78" rx="10" fill="#DCFCE7" stroke="#86EFAC"/>
    <text x="269" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#166534">Main Button</text>
    <text x="269" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#15803D">Start / Learn More</text>
    <text x="220" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Storyboard note: show the first screen users see.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="130" width="320" height="470" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="440" y="130" width="320" height="38" rx="18" fill="#E9D5FF"/>
    <circle cx="468" cy="149" r="5" fill="#7C3AED"/>
    <circle cx="484" cy="149" r="5" fill="#A78BFA"/>
    <circle cx="500" cy="149" r="5" fill="#C4B5FD"/>
    <text x="600" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5B21B6">Screen 2 — Content Page</text>
    <rect x="466" y="188" width="268" height="50" rx="10" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="600" y="219" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#6D28D9">Heading + Navigation</text>
    <rect x="466" y="256" width="118" height="138" rx="10" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="525" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#075985">Image / Video</text>
    <rect x="598" y="256" width="136" height="138" rx="10" fill="#FEFCE8" stroke="#FDE68A"/>
    <text x="666" y="297" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#854D0E">Key Points</text>
    <text x="666" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#A16207">• lesson 1</text>
    <text x="666" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#A16207">• lesson 2</text>
    <text x="666" y="366" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#A16207">• lesson 3</text>
    <rect x="466" y="412" width="268" height="72" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="600" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155">Explanation / Notes</text>
    <text x="600" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Storyboard note: plan the order of information and interaction.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="820" y="130" width="320" height="470" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="820" y="130" width="320" height="38" rx="18" fill="#D1FAE5"/>
    <circle cx="848" cy="149" r="5" fill="#059669"/>
    <circle cx="864" cy="149" r="5" fill="#34D399"/>
    <circle cx="880" cy="149" r="5" fill="#6EE7B7"/>
    <text x="980" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#047857">Screen 3 — Contact / Action</text>
    <rect x="846" y="188" width="268" height="50" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="980" y="219" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#047857">Title + Instructions</text>
    <rect x="846" y="258" width="268" height="170" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="980" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#334155">Simple Form Layout</text>
    <rect x="875" y="305" width="210" height="22" rx="6" fill="#E2E8F0"/>
    <rect x="875" y="338" width="210" height="22" rx="6" fill="#E2E8F0"/>
    <rect x="875" y="371" width="210" height="22" rx="6" fill="#E2E8F0"/>
    <rect x="925" y="406" width="110" height="26" rx="8" fill="#BBF7D0" stroke="#86EFAC"/>
    <text x="980" y="423" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#166534">Submit</text>
    <rect x="846" y="448" width="268" height="36" rx="10" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="980" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#92400E">Footer / Contact details / Copyright</text>
    <text x="980" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Storyboard note: plan the final action the user must take.</text>
  </g>

  <path d="M380 365H430" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M760 365H810" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <polygon points="430,365 417,357 417,373" fill="#64748B"/>
  <polygon points="810,365 797,357 797,373" fill="#64748B"/>
</svg>