  <rect x="620" y="375" width="130" height="70" rx="6" class="shape"/>
  <line x1="300" y1="410" x2="140" y2="410" class="line"/>
  <rect x="70" y="375" width="130" height="70" rx="6" class="shape"/>
  <line x1="685" y1="445" x2="685" y2="550" class="line"/>
  <line x1="135" y1="445" x2="135" y2="550" class="line"/>
  <line x1="135" y1="550" x2="410" y2="550" class="line"/>
