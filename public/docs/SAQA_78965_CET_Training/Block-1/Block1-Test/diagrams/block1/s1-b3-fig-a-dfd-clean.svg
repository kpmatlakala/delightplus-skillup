<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Section 1 Figure A — Blank DFD Template</title>
  <desc id="desc">Blank data flow diagram with four numbered markers for learner completion.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3c88" />
    </marker>
    <style>
      .shape{fill:#fff;stroke:#1f3c88;stroke-width:3}
      .call{fill:#f97316;stroke:#fff;stroke-width:2}
      .num{font:700 16px Arial,sans-serif;fill:#fff}
      .tagFill{fill:#eef5ff;stroke:#8aa7d6;stroke-width:1.5}
      .tagText{font:700 12px Arial,sans-serif;fill:#16325c;letter-spacing:.4px}
    </style>
  </defs>
  <rect width="900" height="520" fill="#f8fbff"/>
  <rect x="700" y="18" width="150" height="28" rx="14" class="tagFill"/>
  <text x="775" y="36" text-anchor="middle" class="tagText">Section 1 · B3 · Fig A</text>

  <rect x="70" y="140" width="140" height="80" rx="6" class="shape"/>
  <circle cx="390" cy="180" r="58" class="shape"/>
  <line x1="210" y1="180" x2="330" y2="180" stroke="#1f3c88" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="448" y1="180" x2="615" y2="180" stroke="#1f3c88" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="640" y1="120" x2="640" y2="250" stroke="#1f3c88" stroke-width="4"/>
  <line x1="680" y1="120" x2="680" y2="250" stroke="#1f3c88" stroke-width="4"/>

  <circle cx="120" cy="300" r="18" class="call"/><text x="120" y="306" text-anchor="middle" class="num">1</text>
  <circle cx="390" cy="300" r="18" class="call"/><text x="390" y="306" text-anchor="middle" class="num">2</text>
  <circle cx="270" cy="135" r="18" class="call"/><text x="270" y="141" text-anchor="middle" class="num">3</text>
  <circle cx="710" cy="105" r="18" class="call"/><text x="710" y="111" text-anchor="middle" class="num">4</text>
</svg>